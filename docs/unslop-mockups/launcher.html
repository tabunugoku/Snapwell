<!doctype html>
<html lang="ja" data-variant="tobe">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snapwell ランチャーの案</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="kit.css">
<style>
/* モニターの作業領域（1280 × 720 DIP を実寸で）。グリッド・パネル・プレビューは Win32 のレイヤードウィンドウで描く */
.monitor { position: relative; width: 1280px; height: 720px; border-radius: var(--sw-r-m); overflow: hidden; user-select: none; background-color: var(--sw-desktop); }
.dim { position: absolute; inset: 0; background: var(--sw-overlay-dim); }
.cells { position: absolute; inset: 8px; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); gap: 8px; }
.cell { border-radius: var(--sw-r-s); background: var(--sw-cell); border: 1px solid var(--sw-cell-line); }
.cell.cursor { box-shadow: inset 0 0 0 2px var(--sw-accent); }
.sel { position: absolute; border-radius: var(--sw-r-m); background: var(--sw-zone-fill); box-shadow: inset 0 0 0 1.5px var(--sw-accent); pointer-events: none; display: grid; place-items: center; }
.sel .size { font: var(--sw-fs-caption)/1 var(--sw-font-mono); color: var(--sw-accent); background: var(--sw-surface); padding: 4px 8px; border-radius: var(--sw-r-s); border: 1px solid var(--sw-accent-line); }
.target { position: absolute; border-radius: var(--sw-r-m); background: var(--sw-surface); border: 1px solid var(--sw-line-strong); box-shadow: var(--sw-shadow-window); overflow: hidden; pointer-events: none; }
.target .tb { height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: var(--sw-fs-caption); color: var(--sw-text-2); border-bottom: 1px solid var(--sw-line); }
.target .tb i { width: 8px; height: 8px; border-radius: 2px; background: var(--sw-text-3); }
.target .sk { padding: 12px; display: grid; gap: 8px; } .target .sk i { height: 8px; border-radius: 4px; background: var(--sw-skeleton); }

.panel { position: absolute; top: var(--sw-launcher-top); left: 50%; width: var(--sw-launcher-w); margin-left: calc(var(--sw-launcher-w) / -2);
  padding: var(--sw-launcher-pad); display: grid; gap: var(--sw-launcher-gap);
  background: var(--sw-surface); border: 1px solid var(--sw-line-strong); border-radius: var(--sw-r-m); box-shadow: var(--sw-shadow-flyout); }
.p-top { height: 32px; display: flex; align-items: center; gap: 8px; }
.p-top .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-top .combo { min-width: 0; width: 96px; font-family: var(--sw-font-mono); font-size: var(--sw-fs-desc); }
.presets { display: flex; flex-wrap: wrap; gap: var(--sw-preset-gap); }
.preset { height: var(--sw-preset-h); display: inline-flex; align-items: center; gap: 8px; padding: 0 12px 0 8px; border-radius: var(--sw-r-s); border: 1px solid var(--sw-line); background: var(--sw-surface); font-size: var(--sw-fs-desc); color: var(--sw-text); }
.preset:hover { background: var(--sw-raised); }
.preset:disabled { color: var(--sw-text-3); background: transparent; }
.preset:disabled .picon rect.f { fill: var(--sw-text-3); }
.picon { width: var(--sw-preset-icon-w); height: var(--sw-preset-icon-h); flex: none; }
.picon rect.f { fill: var(--sw-ink); } .picon rect.o { fill: none; stroke: var(--sw-text-3); stroke-width: 1; }
.picon rect.d { fill: none; stroke: var(--sw-text-2); stroke-width: 1; stroke-dasharray: 2 2; }
.hints { min-height: 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: var(--sw-fs-caption); color: var(--sw-text-3); }
.hints > span { display: inline-flex; align-items: center; gap: 4px; }
.hints .kbd { height: 20px; min-width: 20px; padding: 0 4px; }
.wl { border-top: 1px solid var(--sw-line); margin: 0 calc(var(--sw-launcher-pad) * -1) calc(var(--sw-launcher-pad) * -1); padding: 0 var(--sw-launcher-pad) var(--sw-launcher-pad); }
.wl-head { width: 100%; height: 40px; display: flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 0; text-align: left; }
.wl-head .ico.chev { color: var(--sw-text-2); }
.wl-head[aria-expanded="true"] .ico.chev { transform: rotate(90deg); }
.wl-head .count { margin-left: auto; font-size: var(--sw-fs-caption); color: var(--sw-text-3); font-variant-numeric: tabular-nums; }
.wl-list { display: grid; gap: 0; max-height: calc(var(--sw-list-row-h) * var(--sw-list-rows)); overflow-y: auto; }
.wl-row { height: var(--sw-list-row-h); display: grid; grid-template-columns: 16px 20px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 0 8px; border-radius: var(--sw-r-s); }
.wl-row:hover { background: var(--sw-raised); }
.wl-row .n { font: var(--sw-fs-caption) var(--sw-font-mono); color: var(--sw-text-3); }
.wl-row .ttl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: var(--sw-fs-desc); }
.role { display: inline-flex; align-items: center; gap: 6px; font-size: var(--sw-fs-caption); color: var(--sw-text-2); }
.ring { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--sw-text-3); display: grid; place-items: center; }
.role.main .ring { border-color: var(--sw-accent); } .role.main .ring::after { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--sw-accent); }
.role.main { color: var(--sw-accent); }
.wl-pager { display: flex; justify-content: flex-end; gap: 4px; margin: 8px 0; }
.arr { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.arr button { height: 64px; display: grid; justify-items: center; align-content: center; gap: 4px; border-radius: var(--sw-r-s); border: 1px solid var(--sw-line); background: var(--sw-surface); font-size: var(--sw-fs-caption); }
.arr button:hover:not(:disabled) { background: var(--sw-raised); }
.arr button:disabled { color: var(--sw-text-3); }
.arr svg { width: 44px; height: 28px; }
.arr svg rect { fill: var(--sw-raised); stroke: var(--sw-text-3); stroke-width: 1; }
.arr button:not(:disabled) svg rect.m { fill: var(--sw-zone-fill); stroke: var(--sw-accent); }
.wl-hint { margin-top: 8px; font-size: var(--sw-fs-caption); color: var(--sw-text-3); }
.status-msg { font-size: var(--sw-fs-caption); color: var(--sw-caution); }
:root[data-variant="asis"] .panel { border-radius: 12px; }
/* 現状はセルごとに塗る（OverlayPainter.PaintLauncher）。案は範囲を 1 つの面にまとめる */
:root[data-variant="asis"] .cell.on { background: var(--sw-zone-fill); border-color: var(--sw-accent-line); }
:root[data-variant="asis"] .sel { background: none; box-shadow: none; }
:root[data-variant="asis"] .preset { border-radius: 6px; font-size: 12px; }
:root[data-variant="asis"] .wl { border-radius: 4px; }
.snap-stage { width: 1280px; height: 560px; }

/* 埋め込み（設定の「ランチャー」のプレビュー） */
body.embed { background: transparent; }
body.embed .panel { position: static; margin: 0; width: 100%; box-shadow: none; }
</style>
</head>
<body>
<main class="doc-wrap" id="doc">
  <h1 data-ja="ランチャー" data-en="Launcher">ランチャー</h1>
  <p class="doc-lead" data-ja="作業領域 1280 × 720 DIP のモニターを実寸で描いています。区画をドラッグして範囲を選び、Enter（またはパネル外の「配置」）で対象のウィンドウがばねで移ります。区画の選択がこの面の主役で、色はここに集めます。" data-en="A 1280 × 720 DIP work area at actual size. Drag across cells to select a range; press Enter to move the target window there on a spring. Zone selection is the hero of this surface, so the color lives here."></p>
  <div class="state-bar">
    <span data-ja="一覧" data-en="Window list">一覧</span>
    <div class="seg" id="wlState" role="group">
      <button data-value="collapsed" data-ja="たたむ" data-en="Collapsed">たたむ</button>
      <button data-value="expanded" aria-pressed="true" data-ja="広げる（2 件選択）" data-en="Expanded (2 selected)">広げる</button>
    </div>
    <button class="btn sm" id="place" data-ja="Enter で配置" data-en="Place (Enter)">Enter で配置</button>
  </div>
  <div class="stage" id="monitorStage">
    <div class="monitor" id="monitor">
      <div class="dim"></div>
      <div class="target" id="target"><div class="tb"><i></i><span id="targetTitle"></span></div><div class="sk"><i></i><i style="width:70%"></i><i style="width:45%"></i></div></div>
      <div class="cells" id="cells"></div>
      <div class="sel" id="sel" hidden><span class="size" id="selSize"></span></div>
      <div class="panel" id="panel"></div>
    </div>
  </div>

  <section class="doc-section">
    <h2 data-ja="区画のプレビューと予測の線（ドラッグで投げたとき）" data-en="Zone preview and prediction trace (when thrown)">区画のプレビューと予測の線</h2>
    <p data-ja="離した瞬間から着地するまで、吸着先の区画を半透明の青で塗り、点線の縁を付けます。予測の線は離した位置から止まる先まで、終点に止まった四角（署名の細部）を置きます。下の舞台でタイトルバーをつかんで投げられます。" data-en="From release until landing, the target zone is filled with translucent blue and a dashed edge. The prediction trace runs from the release point to the stop point and ends in the stopped square (the signature detail). Grab the title bar below and throw."></p>
    <div class="stage"><div class="throw-stage snap-stage" id="snapStage"></div></div>
  </section>
</main>
<script src="strings.js"></script>
<script src="kit.js"></script>
<script src="throw.js"></script>
<script>
(function () {
  'use strict';
  const t = SW.t, I = SW.icon;
  const embed = new URLSearchParams(location.search).get('embed') === 'panel';
  if (embed) document.body.classList.add('embed'); else SW.docBar('launcher.html');

  const PRESET = {
    top: [0, 0, 1, .5], bottom: [0, .5, 1, 1], left: [0, 0, .5, 1], right: [.5, 0, 1, 1], tl: [0, 0, .5, .5], tr: [.5, 0, 1, .5], bl: [0, .5, .5, 1], br: [.5, .5, 1, 1],
    l3: [0, 0, 1 / 3, 1], r3: [2 / 3, 0, 1, 1], l23: [0, 0, 2 / 3, 1], r23: [1 / 3, 0, 1, 1], c3: [1 / 3, 0, 2 / 3, 1], center: [.25, .25, .75, .75], centerKeep: [.3, .25, .7, .75], max: [0, 0, 1, 1],
  };
  const SHOWN = ['left', 'right', 'tl', 'l3', 'r23', 'c3', 'center', 'max'];
  const fits8 = id => { const [a, b, c, d] = PRESET[id]; return [a, b, c, d].every(v => Math.abs(v * 8 - Math.round(v * 8)) < 1e-6) || id === 'centerKeep'; };
  function picon(id) {
    const [a, b, c, d] = PRESET[id];
    const cls = id === 'centerKeep' ? 'd' : 'f';
    return '<svg class="picon" viewBox="0 0 20 12" aria-hidden="true"><rect class="o" x=".5" y=".5" width="19" height="11" rx="2"/><rect class="' + cls + '" x="' + (1 + a * 18) + '" y="' + (1 + b * 10) + '" width="' + (c - a) * 18 + '" height="' + (d - b) * 10 + '" rx="1"/></svg>';
  }
  const WINDOWS = [['週次レポート.docx - Word', 'main'], ['売上の集計.xlsx - Excel', 'stack'], ['メモ帳 - 無題'], ['エクスプローラー - ダウンロード'], ['Windows Terminal'], ['設定']];
  let wlOpen = true;

  function renderPanel() {
    const hints = [
      ['←→↑↓', 'LauncherUi.Hint.Move'], ['Shift', 'LauncherUi.Hint.Range'], ['Enter', 'LauncherUi.Hint.Place'], ['Esc', 'LauncherUi.Hint.Close'],
    ].map(([keys, k]) => {
      const tpl = t(k); const parts = tpl.split('{keys}');
      const keyHtml = keys === '←→↑↓' ? [...keys].map(c => '<span class="kbd">' + c + '</span>').join('') : '<span class="kbd">' + keys + '</span>';
      return '<span>' + parts[0] + keyHtml + parts[1] + '</span>';
    }).join('');
    let wl = '<div class="wl"><button class="wl-head" id="wlHead" aria-expanded="' + wlOpen + '">' + I('chevronRight', 'chev') + '<span>' + t('LauncherUi.Heading') + '</span><span class="count">' + (wlOpen ? t('LauncherUi.Selected', { count: 2 }) : t('LauncherUi.NoneSelected')) + '</span></button>';
    if (wlOpen) {
      wl += '<div class="wl-list">' + WINDOWS.map(([title, role], i) => '<label class="wl-row"><span class="n">' + (i + 1) + '</span><span class="check"><input type="checkbox"' + (role ? ' checked' : '') + '></span><span class="ttl">' + title + '</span>' +
        (role ? '<span class="role ' + role + '"><span class="ring"></span>' + t(role === 'main' ? 'LauncherUi.Main' : 'LauncherUi.Stack') + '</span>' : '<span></span>') + '</label>').join('') + '</div>' +
        '<div class="wl-pager"><button class="btn sm" disabled>' + t('LauncherUi.Previous') + '</button><button class="btn sm" disabled>' + t('LauncherUi.Next') + '</button></div>' +
        '<div class="arr">' + [
          ['LauncherUi.Arrange.Grid', '<rect class="m" x="1" y="1" width="20" height="12" rx="2"/><rect x="23" y="1" width="20" height="12" rx="2"/><rect x="1" y="15" width="20" height="12" rx="2"/><rect x="23" y="15" width="20" height="12" rx="2"/>'],
          ['LauncherUi.Arrange.Columns', '<rect class="m" x="1" y="1" width="13" height="26" rx="2"/><rect x="15.5" y="1" width="13" height="26" rx="2"/><rect x="30" y="1" width="13" height="26" rx="2"/>'],
          ['LauncherUi.Arrange.Rows', '<rect class="m" x="1" y="1" width="42" height="8" rx="2"/><rect x="1" y="10" width="42" height="8" rx="2"/><rect x="1" y="19" width="42" height="8" rx="2"/>'],
          ['LauncherUi.Arrange.MainAndStack', '<rect class="m" x="1" y="1" width="26" height="26" rx="2"/><rect x="29" y="1" width="14" height="12" rx="2"/><rect x="29" y="15" width="14" height="12" rx="2"/>'],
        ].map(([k, svg]) => '<button><svg viewBox="0 0 44 28" aria-hidden="true">' + svg + '</svg><span>' + t(k) + '</span></button>').join('') + '</div>' +
        '<div class="wl-hint">' + t('LauncherUi.WindowHint') + '</div>';
    }
    wl += '</div>';
    const panel = document.getElementById('panel');
    panel.innerHTML =
      '<div class="p-top"><span class="tag accent">' + t('LauncherUi.Target') + '</span><span class="title" id="pTitle">' + WINDOWS[0][0] + '</span><button class="combo">8 × 8' + I('chevron') + '</button></div>' +
      '<div class="presets">' + SHOWN.map(id => '<button class="preset" data-preset="' + id + '"' + (fits8(id) ? '' : ' disabled') + '>' + picon(id) + '<span>' + t('Launcher.Preset.' + id) + '</span></button>').join('') + '</div>' +
      '<div class="hints">' + hints + '</div>' + (embed ? '' : wl);
    panel.querySelectorAll('.preset:not(:disabled)').forEach(b => b.addEventListener('click', () => { const [a, bb, c, d] = PRESET[b.dataset.preset]; select(Math.round(a * 8), Math.round(bb * 8), Math.round(c * 8) - 1, Math.round(d * 8) - 1); }));
    const head = panel.querySelector('#wlHead'); if (head) head.addEventListener('click', () => { wlOpen = !wlOpen; syncWl(); renderPanel(); });
  }
  function syncWl() { document.querySelectorAll('#wlState button').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.value === 'expanded') === wlOpen))); }

  if (embed) { SW.onChange(renderPanel); SW.apply(); document.getElementById('doc').querySelectorAll('h1,.doc-lead,.state-bar,.doc-section').forEach(e => e.remove()); document.getElementById('monitor').querySelectorAll('.target,.dim,.cells,.sel').forEach(e => e.remove()); document.getElementById('doc').style.padding = '0'; document.getElementById('monitorStage').style.cssText = 'padding:0;background:none;overflow:visible'; document.getElementById('monitor').style.cssText = 'width:auto;height:auto;background:none'; return; }

  // ---------- 区画とドラッグの範囲選択 ----------
  const W = 1280, H = 720, PAD = 8, GAP = 8, N = 8;
  const cw = (W - PAD * 2 - GAP * (N - 1)) / N, ch = (H - PAD * 2 - GAP * (N - 1)) / N;
  const cells = document.getElementById('cells');
  for (let i = 0; i < N * N; i++) { const c = document.createElement('div'); c.className = 'cell'; c.dataset.c = i % N; c.dataset.r = Math.floor(i / N); cells.appendChild(c); }
  const rectOf = (c0, r0, c1, r1) => ({ x: PAD + c0 * (cw + GAP), y: PAD + r0 * (ch + GAP), w: (c1 - c0 + 1) * cw + (c1 - c0) * GAP, h: (r1 - r0 + 1) * ch + (r1 - r0) * GAP });
  let range = null, anchor = null;
  function select(c0, r0, c1, r1) {
    range = [Math.min(c0, c1), Math.min(r0, r1), Math.max(c0, c1), Math.max(r0, r1)];
    const r = rectOf(...range), sel = document.getElementById('sel');
    Object.assign(sel.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' }); sel.hidden = false;
    cells.querySelectorAll('.cell').forEach(c => c.classList.toggle('on', +c.dataset.c >= range[0] && +c.dataset.c <= range[2] && +c.dataset.r >= range[1] && +c.dataset.r <= range[3]));
    const cols = range[2] - range[0] + 1, rows = range[3] - range[1] + 1;
    document.getElementById('selSize').textContent = t('LauncherUi.Selection.Other', { columns: cols, rows, width: Math.round(cols * 2560 / 8), height: Math.round(rows * 1440 / 8) });
  }
  cells.addEventListener('pointerdown', e => { const c = e.target.closest('.cell'); if (!c) return; anchor = [+c.dataset.c, +c.dataset.r]; select(anchor[0], anchor[1], anchor[0], anchor[1]); cells.setPointerCapture(e.pointerId); });
  cells.addEventListener('pointermove', e => {
    if (!anchor) return; const el = document.elementFromPoint(e.clientX, e.clientY); const c = el && el.closest('.cell'); if (c) select(anchor[0], anchor[1], +c.dataset.c, +c.dataset.r);
  });
  cells.addEventListener('pointerup', () => { anchor = null; });

  // ---------- 対象のウィンドウ: 位置と大きさを同じばね（標準の操作感）で動かす ----------
  const target = document.getElementById('target');
  const box = { x: 360, y: 300, w: 520, h: 320 };
  const draw = () => Object.assign(target.style, { left: box.x + 'px', top: box.y + 'px', width: box.w + 'px', height: box.h + 'px' });
  draw();
  const springs = {};
  ['x', 'y', 'w', 'h'].forEach(k => {
    // ランチャーの配置は位置と大きさに同じばね（DESIGN §5.5 のモックアップの sizeMode: 'smooth'）
    springs[k] = new SW.Spring('toggle', box[k], v => { box[k] = v; draw(); });
    const P = FEEL_PRESETS.standard, kk = P.m * Math.pow(2 * Math.PI * P.f, 2);
    springs[k].p = { m: P.m, k: kk, c: 2 * P.zeta * Math.sqrt(kk * P.m) };
  });
  function place() { if (!range) return; const r = rectOf(...range); ['x', 'y', 'w', 'h'].forEach(k => springs[k].to(r[k])); document.getElementById('sel').hidden = true; }
  document.getElementById('place').addEventListener('click', place);
  document.addEventListener('keydown', e => { if (e.key === 'Enter' && range) place(); });

  document.querySelectorAll('#wlState button').forEach(b => b.addEventListener('click', () => { wlOpen = b.dataset.value === 'expanded'; syncWl(); renderPanel(); }));

  new ThrowStage(document.getElementById('snapStage'), { preset: 'standard', title: '週次レポート.docx - Word', cardW: 360, cardH: 220 });

  SW.onChange(() => { renderPanel(); document.getElementById('targetTitle').textContent = WINDOWS[0][0]; if (range) select(...range); });
  SW.apply();
  select(4, 4, 7, 7);
})();
</script>
</body>
</html>
