<!doctype html>
<html lang="ja" data-variant="tobe">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snapwell 設定画面の案</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="kit.css">
<style>
/* ---------- 設定画面（MainWindow 1060 × 780 DIP） ---------- */
.sw-settings { width: 1060px; height: 780px; }
.sw-body { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--sw-nav-w) minmax(0, 1fr); background: var(--sw-canvas); }
.sw-nav { position: relative; padding: 8px 0; display: flex; flex-direction: column; gap: var(--sw-nav-gap); }
.sw-nav-item {
  position: relative; height: var(--sw-nav-h); margin: 0 var(--sw-nav-mx); padding: 0 12px 0 16px;
  display: flex; align-items: center; gap: var(--sw-icon-gap); border: 0; border-radius: var(--sw-r-s);
  background: transparent; color: var(--sw-text); text-align: left; font-size: var(--sw-fs-body);
}
.sw-nav-item .ico { color: var(--sw-text-2); }
.sw-nav-item:hover { background: var(--sw-raised); }
.sw-nav-item[aria-current="page"] { background: var(--sw-raised); }
.sw-nav-item[aria-current="page"] .ico { color: var(--sw-text); }
.sw-nav-ind { position: absolute; left: var(--sw-nav-mx); top: 0; width: var(--sw-nav-ind-w); height: var(--sw-nav-ind-h); border-radius: 2px; background: var(--sw-ink); pointer-events: none; }
:root[data-variant="asis"] .sw-nav-item[aria-current="page"] { background: var(--sw-surface); box-shadow: 0 0 0 1px var(--sw-line); }
:root[data-variant="asis"] .sw-body { background: var(--sw-surface); }
:root[data-variant="asis"] .sw-nav { background: var(--sw-canvas); border-right: 1px solid var(--sw-line); }
.sw-content { overflow-y: auto; min-height: 0; }
.sw-page { padding: var(--sw-page-pad-top) var(--sw-page-pad-x) 40px; max-width: 820px; }
.sw-title { margin: 0 0 4px; font: 400 var(--sw-fs-title)/var(--sw-lh-title) var(--sw-font-display); letter-spacing: var(--sw-title-tracking); color: var(--sw-text); }
:root[data-variant="asis"] .sw-title { font-weight: 500; color: var(--sw-ink); }
.sw-lead { margin: 0 0 24px; color: var(--sw-text-2); max-width: 680px; }
.sw-group { margin-top: var(--sw-group-gap); }
.sw-group:first-of-type { margin-top: 0; }
.sw-group-title { margin: 0 0 var(--sw-group-title-gap); font-size: var(--sw-fs-body); line-height: var(--sw-lh-body); font-weight: var(--sw-fw-strong); color: var(--sw-text); }
:root[data-variant="asis"] .sw-group-title { font-size: 12.5px; }
.sw-card { background: var(--sw-surface); border: 1px solid var(--sw-line); border-radius: var(--sw-r-m); box-shadow: var(--sw-shadow-card); }
.sw-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--sw-row-gap); padding: var(--sw-row-pad-y) var(--sw-row-pad-x); min-height: var(--sw-row-min-h); }
.sw-row + .sw-row, .sw-row + .sw-sub, .sw-sub + .sw-row { border-top: 1px solid var(--sw-line); }
.sw-row-title { color: var(--sw-text); }
.sw-row-desc { margin-top: 0; font-size: var(--sw-fs-desc); line-height: var(--sw-lh-desc); color: var(--sw-text-2); }
:root[data-variant="asis"] .sw-row-desc { color: var(--sw-text-3); }
.sw-row-ctl { display: flex; align-items: center; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.sw-hint { margin: 8px 0 0; font-size: var(--sw-fs-desc); line-height: var(--sw-lh-desc); color: var(--sw-text-2); }
.sw-sub { padding: 12px 16px; }
.sw-footer { height: var(--sw-footer-h); flex: none; display: flex; align-items: center; gap: 16px; padding: 0 var(--sw-page-pad-x); border-top: 1px solid var(--sw-line); background: var(--sw-canvas); }
:root[data-variant="asis"] .sw-footer { background: var(--sw-surface); }
.sw-footer .status { flex: 1; font-size: var(--sw-fs-desc); color: var(--sw-text-2); display: flex; align-items: center; gap: 8px; }
.sw-footer .status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--sw-ink); }
.sw-notice { margin: 0 0 16px; }

/* 分割と間隔 */
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { height: var(--sw-control-h); padding: 0 12px; border-radius: var(--sw-r-s); border: 1px solid var(--sw-line-strong); background: var(--sw-surface); font-family: var(--sw-font-mono); font-size: var(--sw-fs-desc); }
.chip:hover { background: var(--sw-raised); }
.chip[aria-pressed="true"] { background: var(--sw-ink); color: var(--sw-on-ink); border-color: var(--sw-ink); }
.grid-preview-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 24px; padding: 16px; align-items: start; }
.grid-preview { position: relative; aspect-ratio: 16 / 9; border-radius: var(--sw-r-s); background: var(--sw-desktop); overflow: hidden; }
.grid-preview .cell { position: absolute; border: 1px solid var(--sw-cell-line); border-radius: 2px; background: var(--sw-cell); }
.grid-preview .gwin { position: absolute; border-radius: var(--sw-r-s); background: var(--sw-surface); border: 1px solid var(--sw-line-strong); display: grid; place-items: center; font: var(--sw-fs-caption) var(--sw-font-mono); color: var(--sw-text-2); box-shadow: var(--sw-shadow-card); }
.grid-side { display: grid; gap: 16px; }
.field-label { font-size: var(--sw-fs-desc); color: var(--sw-text-2); margin-bottom: 4px; display: flex; justify-content: space-between; }

/* ホットキー */
.hk-tools { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
.hk-tools .textbox { width: 280px; }
.hk-tools .count { margin-left: auto; font-size: var(--sw-fs-caption); color: var(--sw-text-3); }
.hk-head, .hk-row { display: grid; grid-template-columns: minmax(0, 1fr) 248px 168px; gap: 16px; align-items: center; padding: 0 16px; }
.hk-head { height: 32px; font-size: var(--sw-fs-caption); color: var(--sw-text-3); border-bottom: 1px solid var(--sw-line); }
.hk-group { height: 36px; display: flex; align-items: flex-end; padding: 0 16px 4px; font-size: var(--sw-fs-caption); color: var(--sw-text-3); font-weight: var(--sw-fw-strong); }
.hk-row { min-height: 44px; border-top: 1px solid var(--sw-line); }
.hk-key { height: 32px; display: flex; align-items: center; padding: 0 8px; border-radius: var(--sw-r-s); border: 1px solid transparent; }
.hk-key:hover { background: var(--sw-raised); }
.hk-key.capturing { border-color: var(--sw-accent); background: var(--sw-surface); color: var(--sw-text-3); font-size: var(--sw-fs-desc); }
.hk-msg { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; padding: 0 0 12px; flex-wrap: wrap; font-size: var(--sw-fs-desc); color: var(--sw-text-2); }

/* 操作感 */
.feel-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.feel-card { text-align: left; padding: 12px; border-radius: var(--sw-r-m); border: 1px solid var(--sw-line); background: var(--sw-surface); display: grid; gap: 8px; }
.feel-card:hover { border-color: var(--sw-line-strong); }
.feel-card[aria-pressed="true"] { border-color: var(--sw-ink); box-shadow: inset 0 0 0 1px var(--sw-ink); }
.feel-card .name { font-weight: var(--sw-fw-regular); }
.feel-card[aria-pressed="true"] .name { font-weight: var(--sw-fw-strong); }
.feel-card .metrics { font-size: var(--sw-fs-caption); line-height: var(--sw-lh-caption); font-variant-numeric: tabular-nums; color: var(--sw-text-3); }
.feel-card svg { width: 100%; height: 64px; }
.curve-axis { stroke: var(--sw-line); stroke-width: 1; }
.curve-target { stroke: var(--sw-text-3); stroke-width: 1; stroke-dasharray: 4 4; }
.curve { fill: none; stroke: var(--sw-text-3); stroke-width: 1.5; }
.feel-card[aria-pressed="true"] .curve { stroke: var(--sw-accent); stroke-width: 2; }
.feel-card .stop-mark { display: none; }
.feel-card[aria-pressed="true"] .stop-mark { display: block; }
.feel-legend { display: flex; gap: 16px; align-items: center; margin-top: 8px; font-size: var(--sw-fs-desc); color: var(--sw-text-2); flex-wrap: wrap; }
.expander-head { width: 100%; display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 48px; border: 0; background: transparent; text-align: left; border-radius: var(--sw-r-m); }
.expander-head:hover { background: var(--sw-raised); }
.expander-head .ico { color: var(--sw-text-2); }
.expander-head[aria-expanded="true"] .ico.chev { transform: rotate(90deg); }
.expander-body { border-top: 1px solid var(--sw-line); padding: 16px; display: grid; gap: 12px; }
.trial-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.trial-stage { height: 400px; }
.derived { display: grid; grid-template-columns: repeat(3, auto); gap: 4px 24px; font: var(--sw-fs-desc)/var(--sw-lh-desc) var(--sw-font-mono); color: var(--sw-text-2); }
.derived b { font-weight: var(--sw-fw-regular); color: var(--sw-text); }
.param-ctl { display: flex; align-items: center; gap: 12px; }

/* ルール */
.rules-head, .rule-row { display: grid; grid-template-columns: 56px minmax(0, 1fr) 120px 140px 136px; gap: 12px; align-items: center; padding: 0 16px; }
.rules-head { height: 32px; font-size: var(--sw-fs-caption); color: var(--sw-text-3); border-bottom: 1px solid var(--sw-line); }
.rule-row { min-height: 56px; border-top: 1px solid var(--sw-line); }
.rule-row:first-of-type { border-top: 0; }
.rule-cond { font-size: var(--sw-fs-desc); line-height: var(--sw-lh-desc); }
.rule-cond .mono { color: var(--sw-text); }
.rule-cond .meta { color: var(--sw-text-3); font-size: var(--sw-fs-caption); }
.rule-actions { display: flex; gap: 0; justify-content: flex-end; }
.icon-btn { width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: var(--sw-r-s); background: transparent; color: var(--sw-text-2); }
.icon-btn:hover { background: var(--sw-raised); color: var(--sw-text); }
.icon-btn:disabled { color: var(--sw-text-3); opacity: 0.5; }
.list-plain { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: var(--sw-fs-desc); line-height: var(--sw-lh-desc); color: var(--sw-text-2); }

/* 標準機能の図 */
.diagram { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; border-top: 1px solid var(--sw-line); }
.diagram figure { margin: 0; display: grid; gap: 8px; }
.diagram figcaption { font-size: var(--sw-fs-caption); color: var(--sw-text-3); }
.diagram .scr { position: relative; height: 136px; border-radius: var(--sw-r-s); background: var(--sw-desktop); overflow: hidden; }
.diagram p { margin: 0; font-size: var(--sw-fs-desc); line-height: var(--sw-lh-desc); color: var(--sw-text-2); }
.diagram .reason { grid-column: 1 / -1; padding-top: 12px; border-top: 1px solid var(--sw-line); }
.disclosure { display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; padding: 0; color: var(--sw-text-2); font-size: var(--sw-fs-desc); }
.disclosure:hover { color: var(--sw-text); }
.disclosure[aria-expanded="true"] .ico { transform: rotate(90deg); }

/* 同期 */
.path { font: var(--sw-fs-desc)/var(--sw-lh-desc) var(--sw-font-mono); color: var(--sw-text-2); }

/* ランチャー */
.lp-tools { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
.lp-tools .count { margin-left: auto; font-size: var(--sw-fs-caption); color: var(--sw-text-3); }
.lp-groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; }
.lp-group { padding: 12px 16px; border-top: 1px solid var(--sw-line); }
.lp-group:nth-child(-n+2) { border-top: 0; }
.lp-group:nth-child(odd) { border-right: 1px solid var(--sw-line); }
.lp-group h4 { margin: 0 0 8px; font-size: var(--sw-fs-caption); color: var(--sw-text-3); font-weight: var(--sw-fw-regular); }
.lp-opts { display: grid; gap: 4px; }
.lp-opt { display: flex; align-items: center; gap: 8px; min-height: 32px; }
.picon { width: 20px; height: 12px; flex: none; }
.picon rect.f { fill: var(--sw-ink); } .picon rect.o { fill: none; stroke: var(--sw-text-3); stroke-width: 1; }
.picon rect.d { fill: none; stroke: var(--sw-text-2); stroke-width: 1; stroke-dasharray: 2 2; }
.lp-opt.disabled { color: var(--sw-text-3); }

/* 外観 */
.corner-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 16px; }
.corner-card { border: 1px solid var(--sw-line); border-radius: var(--sw-r-m); padding: 12px; display: grid; gap: 8px; background: var(--sw-surface); text-align: left; }
.corner-card[aria-pressed="true"] { border-color: var(--sw-ink); box-shadow: inset 0 0 0 1px var(--sw-ink); }
.corner-card .shape { height: 56px; border: 1.5px solid var(--sw-text-2); border-right: 0; border-bottom: 0; margin: 4px 0 0 4px; }
.corner-card .lbl { font-size: var(--sw-fs-body); }
.corner-card .d { font-size: var(--sw-fs-caption); line-height: var(--sw-lh-caption); color: var(--sw-text-3); }
.ov-example { position: relative; height: 240px; margin: 16px; border-radius: var(--sw-r-s); background: var(--sw-desktop); overflow: hidden; }
.ov-example svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.ov-win { fill: var(--sw-surface); stroke: var(--sw-line-strong); }
.ov-zone { fill: var(--sw-zone-fill); }
.ov-zone-line { fill: none; stroke: var(--sw-accent-line); stroke-width: 1.5; stroke-dasharray: 4 4; }
.ov-off { font: var(--sw-fs-desc) var(--sw-font-ui); fill: var(--sw-text-2); }

/* 一般: 更新 */
.update-offer { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; }
.update-offer .v { font-weight: var(--sw-fw-strong); }
.progress { height: 4px; border-radius: 2px; background: var(--sw-line-strong); overflow: hidden; margin: 8px 0 4px; }
.progress i { display: block; height: 100%; width: 42%; background: var(--sw-ink); }
.update-dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--sw-accent); margin-right: 8px; vertical-align: 1px; }

/* ---------- 初回セットアップ（820 × 720） ---------- */
.sw-setup { width: 820px; height: 720px; }
.setup-main { flex: 1; min-height: 0; padding: 20px 24px 24px; display: flex; flex-direction: column; background: var(--sw-canvas); }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
.step { height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: var(--sw-r-s); color: var(--sw-text-3); font-size: var(--sw-fs-desc); border: 1px solid transparent; }
.step .n { font-family: var(--sw-font-mono); font-size: var(--sw-fs-caption); }
.step.done { color: var(--sw-text-2); }
.step.current { color: var(--sw-text); background: var(--sw-surface); border-color: var(--sw-line); }
.setup-card { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--sw-surface); border: 1px solid var(--sw-line); border-radius: var(--sw-r-m); overflow: hidden; }
:root[data-variant="asis"] .setup-card { border-radius: 12px; }
.setup-inner { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 32px; }
.setup-h { margin: 0 0 8px; font: 400 var(--sw-fs-title)/var(--sw-lh-title) var(--sw-font-display); }
.setup-lead { margin: 0 0 16px; color: var(--sw-text-2); white-space: pre-line; }
.setup-foot { height: 64px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 20px; border-top: 1px solid var(--sw-line); }
.setup-foot .count { margin-right: auto; font: var(--sw-fs-caption) var(--sw-font-mono); color: var(--sw-text-3); }
.welcome-stage { height: 264px; margin-bottom: 12px; }
.welcome-hint { font-size: var(--sw-fs-desc); color: var(--sw-text-2); min-height: 20px; display: flex; align-items: center; gap: 8px; }
.plan-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.plan-card { text-align: left; border: 1px solid var(--sw-line); border-radius: var(--sw-r-m); padding: 12px; background: var(--sw-surface); display: grid; gap: 8px; }
.plan-card[aria-pressed="true"] { border-color: var(--sw-ink); box-shadow: inset 0 0 0 1px var(--sw-ink); }
.plan-card .mini { display: grid; gap: 2px; aspect-ratio: 16/9; padding: 2px; border-radius: var(--sw-r-s); background: var(--sw-desktop); }
.plan-card .mini i { background: var(--sw-cell); border: 1px solid var(--sw-cell-line); border-radius: 1px; }
.plan-card .nm { font: var(--sw-fs-body) var(--sw-font-mono); }
.plan-card .d { font-size: var(--sw-fs-caption); line-height: var(--sw-lh-caption); color: var(--sw-text-3); }
.std-table { width: 100%; border-collapse: collapse; font-size: var(--sw-fs-desc); }
.std-table td { padding: 12px 16px; border-top: 1px solid var(--sw-line); }
.std-table tr:first-child td { border-top: 0; }
.consent { display: flex; gap: 12px; align-items: flex-start; margin-top: 16px; font-size: var(--sw-fs-desc); line-height: var(--sw-lh-desc); }
.consent input { margin-top: 0; flex: none; }

/* ダイアログ */
.dialog { width: 448px; background: var(--sw-surface); border: 1px solid var(--sw-line-strong); border-radius: var(--sw-r-m); box-shadow: var(--sw-shadow-flyout); overflow: hidden; }
.dialog-body { padding: 24px; }
.dialog-body h3 { margin: 0 0 12px; font-size: var(--sw-fs-subtitle); line-height: var(--sw-lh-subtitle); font-weight: var(--sw-fw-strong); }
.dialog-body p { margin: 0; color: var(--sw-text-2); }
.dialog-foot { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 24px; background: var(--sw-canvas); border-top: 1px solid var(--sw-line); }
</style>
</head>
<body>
<main class="doc-wrap">
  <h1 data-ja="設定画面" data-en="Settings">設定画面</h1>
  <p class="doc-lead" data-ja="実寸（1060 × 780 DIP）で描いています。左のナビでページを切り替え、スイッチやボタンを操作できます。上の切り替えで、現状と案、明暗、言語を比べられます。" data-en="Drawn at actual size (1060 × 780 DIP). Switch pages in the left navigation and operate switches and buttons. Use the bar above to compare as-is and to-be, light and dark, and languages."></p>

  <div class="state-bar">
    <span data-ja="状態の例" data-en="Sample state">状態の例</span>
    <div class="seg" id="demoState" role="group">
      <button data-value="normal" aria-pressed="true" data-ja="通常" data-en="Normal">通常</button>
      <button data-value="dirty" data-ja="未保存の変更" data-en="Unsaved changes">未保存の変更</button>
      <button data-value="error" data-ja="読み込みエラー" data-en="Load error">読み込みエラー</button>
    </div>
    <span data-ja="更新" data-en="Update">更新</span>
    <div class="seg" id="demoUpdate" role="group">
      <button data-value="none" data-ja="なし" data-en="None">なし</button>
      <button data-value="offer" aria-pressed="true" data-ja="あり" data-en="Available">あり</button>
      <button data-value="downloading" data-ja="ダウンロード中" data-en="Downloading">ダウンロード中</button>
      <button data-value="required" data-ja="最低バージョン未満" data-en="Below minimum">最低バージョン未満</button>
    </div>
  </div>

  <div class="stage">
    <div class="win sw-settings" id="settingsWin">
      <div class="titlebar"><span id="tbLogo"></span><span data-k="MainWindow_Title.Text"></span>
        <span class="caps"><span>__ICON_min__</span><span>__ICON_max__</span><span>__ICON_close__</span></span></div>
      <div class="sw-body">
        <nav class="sw-nav" id="nav" aria-label="ページ"><span class="sw-nav-ind" id="navInd"></span></nav>
        <div class="sw-content" id="content"></div>
      </div>
      <div class="sw-footer">
        <div class="status" id="footerStatus"></div>
        <button class="btn primary" data-k="MainWindow_Save.Content"></button>
      </div>
    </div>
  </div>

  <section class="doc-section">
    <h2 data-ja="初回セットアップ（820 × 720 DIP）" data-en="First-run setup (820 × 720 DIP)">初回セットアップ</h2>
    <p data-ja="ようこそでは、上のウィンドウのタイトルバーをつかんで投げられます。投げると区画のプレビューと予測の線（署名の細部）が出ます。" data-en="On the welcome step, grab the window's title bar and throw it. The zone preview and prediction trace (the signature detail) appear."></p>
    <div class="stage">
      <div class="win sw-setup">
        <div class="titlebar"><span id="tbLogo2"></span><span>Snapwell</span><span class="caps"><span>__ICON_min__</span><span>__ICON_close__</span></span></div>
        <div class="setup-main">
          <div class="steps" id="steps"></div>
          <div class="setup-card">
            <div class="setup-inner" id="setupInner"></div>
            <div class="setup-foot">
              <span class="count" id="setupCount"></span>
              <button class="btn" id="setupBack" data-k="Setup_Back.Content"></button>
              <button class="btn primary" id="setupNext"></button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="doc-section">
    <h2 data-ja="閉じるときの確認（ContentDialog）" data-en="Close confirmation (ContentDialog)">閉じるときの確認</h2>
    <p data-ja="ボタンは同じ幅の 3 つ。主の操作だけを塗ります。" data-en="Three equal-width buttons. Only the primary action is filled."></p>
    <div class="stage">

<script>
(function () {
  'use strict';
  const t = SW.t, I = SW.icon;
  document.body.innerHTML = document.body.innerHTML.replace(/__ICON_(\w+)__/g, (_, n) => I(n));
  SW.docBar('settings.html');
  document.getElementById('tbLogo').innerHTML = SW.logo(16);
  document.getElementById('tbLogo2').innerHTML = SW.logo(16);

  const demo = { state: 'normal', update: 'offer' };
  const PAGES = [
    ['general', 'Nav_General.Content'], ['grid', 'Nav_Grid.Content'], ['hotkeys', 'Nav_Hotkeys.Content'],

  let current = 'general';

  // ---------- 部品の HTML ----------
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  // ---------- 各ページ ----------

  render.general = () => {
    const err = demo.state === 'error' ? '<div class="infobar error sw-notice">' + I('error') + '<div>' + esc(t('Session.Load.Failed')) + '</div></div>' : '';
    const langs = ['Language.Auto'];

        '<label class="check"><input type="checkbox" checked>' + esc(t('Grid_LinkEdgeCheck.Content')) + '</label></div></div>')) +

      group('Grid_ResizeTitle.Text', card(

      group('Grid_NumbersTitle.Text', card(
        row('Grid_ColumnsTitle.Text', 'Grid_ColumnsDescription.Text', '<input class="textbox numbox" value="8">') +
        row('Grid_RowsTitle.Text', 'Grid_RowsDescription.Text', '<input class="textbox numbox" value="8">') +
        row('Grid_GapPixelsTitle.Text', 'Grid_GapPixelsDescription.Text', '<input class="textbox numbox" value="8">') +
        row('Grid_EdgePixelsTitle.Text', 'Grid_EdgePixelsDescription.Text', '<input class="textbox numbox" value="8">')));
  };

  render.hotkeys = () => {
    const G = [
      ['Hotkey.Group.Placement', [['Hotkey.Command.LeftHalf', 'Ctrl+Alt+←'], ['Hotkey.Command.RightHalf', 'Ctrl+Alt+→', 'changed'], ['Hotkey.Command.TopLeftQuarter', 'Ctrl+Alt+U'], ['Hotkey.Command.Maximize', 'Ctrl+Alt+Enter', 'dup'], ['Hotkey.Command.CenterWindow', 'Ctrl+Alt+C', 'capture']]],
      ['Hotkey.Group.Arrange', [['Hotkey.Command.ArrangeGrid', 'Ctrl+Alt+A'], ['Hotkey.Command.ArrangeAllMonitors', 'Ctrl+Alt+Enter', 'dup']]],
      ['Hotkey.Group.Monitor', [['Hotkey.Command.NextMonitor', 'Ctrl+Alt+PageDown', 'inuse'], ['Hotkey.Command.MoveCellLeft', '']]],

      group(null, '<div class="infobar">' + I('info') + '<div><b>' + esc(t('Hotkeys_Note.Text')) + '</b> ' + esc(t('Hotkeys_WinHint.Text')) + '</div></div>');
  };

  // ばねのステップ応答（閉形式）。1.4 秒を幅に写す
  function curve(f, zeta, w, h) {
    const wn = 2 * Math.PI * f, pts = [];
    for (let i = 0; i <= 70; i++) {
      const tt = 1.4 * i / 70; let x;
      if (zeta < 1) { const wd = wn * Math.sqrt(1 - zeta * zeta); x = 1 - Math.exp(-zeta * wn * tt) * (Math.cos(wd * tt) + zeta / Math.sqrt(1 - zeta * zeta) * Math.sin(wd * tt)); }
      else x = 1 - Math.exp(-wn * tt) * (1 + wn * tt);
      pts.push([4 + (w - 8) * i / 70, h - 8 - (h - 24) * x]);
    }
    return pts;
  }
  let feelSel = 'standard', trial = null;
  render.feel = () => {
    const P = [['standard', 'Feel_PresetName_Standard.Text', 2.4, 0.7, '0.40', '4.6'], ['crisp', 'Feel_PresetName_Crisp.Text', 3.2, 0.6, '0.30', '9.5'], ['smooth', 'Feel_PresetName_Smooth.Text', 1.8, 0.8, '0.33', '1.5'], ['bouncy', 'Feel_PresetName_Bouncy.Text', 2.8, 0.45, '0.47', '20.5']];
    const cards = P.map(([id, name, f, z, settle, over]) => {
      const pts = curve(f, z, 180, 64), d = 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L');
      const ty = 64 - 8 - 40, settleX = 4 + 172 * (parseFloat(settle) / 1.4);
      return '<button class="feel-card" data-feel="' + id + '" aria-pressed="' + (feelSel === id) + '"><span class="name">' + esc(t(name)) + '</span>' +
        '<svg viewBox="0 0 180 64" preserveAspectRatio="none" aria-hidden="true"><line class="curve-axis" x1="4" y1="56" x2="176" y2="56"/><line class="curve-target" x1="4" y1="' + ty + '" x2="176" y2="' + ty + '"/><path class="curve" d="' + d + '"/>' +
        '<rect class="stop-mark" x="' + (settleX - 3) + '" y="' + (ty - 3) + '" width="6" height="6" rx="1.5"/></svg>' +
        '<span class="metrics">' + esc(t('Feel.StepMetrics', { settle, overshoot: over })) + '</span></button>';
    }).join('');
    const param = (tk, dk, v, min, max, unit) => row(tk, dk, '<div class="param-ctl">' + slider(v, min, max, unit, t(tk)) + '</div>');
    return head('Feel_Title.Text', 'Feel_Lead.Text') +
      '<div class="feel-cards" role="group">' + cards + '</div>' +
      '<div class="feel-legend"><span>' + esc(t('Feel_CurveLegend.Text')) + '</span></div><p class="sw-hint">' + esc(t('Feel_CurveThrowNote.Text')) + '</p>' +
      group(null, card('<button class="expander-head" id="trialHead" aria-expanded="true">' + I('chevronRight', 'chev') + '<span>' + esc(t('Feel_TrialTitle.Text')) + '</span></button>' +
        '<div class="expander-body" id="trialBody"><div class="trial-tools"><div class="seg" id="trialMode"><button data-mode="zones" aria-pressed="true">' + esc(t('Feel_TrialZonesButton.Content')) + '</button><button data-mode="corners">' + esc(t('Feel_TrialCornersButton.Content')) + '</button></div>' +
        btn(t('Feel_TrialThrowButton.Content')).replace('<button', '<button id="trialThrow"') + '</div>' +
        '<div class="trial-stage" id="trialStage"></div><p class="sw-row-desc" style="margin:0">' + esc(t('Feel_TrialHint.Text')) + '</p></div>')) +
      group('Feel_DetailsTitle.Text', card(
        row('Feel_ModeTitle.Text', 'Feel_ModeDescription.Text', combo(t('Feel_ModeZones.Content'))) +
        param('Feel_MassTitle.Text', 'Feel_MassDescription.Text', 0.6, 0.15, 8, '') +

        row('Feel_DerivedTitle.Text', null, '<div class="derived"><span>k <b>136.4</b></span><span>c <b>12.70</b></span><span>m/c <b>0.047 s</b></span></div>') +
        '<div class="sw-sub" style="display:flex;justify-content:space-between;align-items:center"><span class="sw-row-desc">' + esc(t('Feel.State.Preset', { feel: t('Feel_PresetName_Standard.Text') })) + '</span>' + btn(t('Feel_FeelResetButton.Content')) + '</div>'),

  render.rules = () => {

      card('<div class="rules-head"><span>' + esc(t('Rules_EnabledColumn.Text')) + '</span><span>' + esc(t('Rules_ConditionColumn.Text')) + '</span><span>' + esc(t('Rules_PlacementColumn.Text')) + '</span><span>' + esc(t('Rules_CornerColumn.Text')) + '</span><span></span></div>' + rows) +

    const before = scr('<rect x="4" y="4" width="136" height="128" rx="4" fill="var(--sw-text-3)" opacity="0.18"/>' + win(84, 40, 96, 60));
    const after = scr('<rect x="4" y="4" width="136" height="128" rx="4" fill="var(--sw-zone-fill)"/><rect x="4.75" y="4.75" width="134.5" height="126.5" rx="4" fill="none" stroke="var(--sw-accent-line)" stroke-width="1.5" stroke-dasharray="4 4"/>' + win(150, 56, 96, 60) + '<line class="trace" x1="198" y1="86" x2="72" y2="68"/><rect class="stop-mark" x="68" y="64" width="8" height="8" rx="2"/>');
    return '<div class="diagram"><figure><figcaption>' + esc(t('OsDiagram_BeforeHeading.Text')) + ' · ' + esc(t('Os.Diagram.Released')) + '</figcaption>' + before + '<p>' + esc(t('Os.Diagram.' + kind + 'Before')) + '</p></figure>' +
      '<figure><figcaption>' + esc(t('OsDiagram_AfterHeading.Text')) + ' · ' + esc(t('Os.Diagram.Released')) + '</figcaption>' + after + '<p>' + esc(t('Os.Diagram.' + kind + 'After')) + '</p></figure>' +
      '<p class="reason">' + esc(t('Os.Diagram.StopReason', { reason: t('Os.Diagram.' + kind + 'Reason') })) + '</p></div>';
  }
  render.os = () => {
    const disc = (open) => '<div style="margin-top:4px"><button class="disclosure" aria-expanded="' + open + '">' + I('chevronRight') + esc(t('OsDiagram_DisclosureText.Text')) + '</button></div>';

    return head('Os_Title.Text', 'Os_Lead.Text') +
      group(null, card(

    '<div class="infobar sw-notice">' + I('info') + '<div>' + esc(t('Backup_CloudHint.Text')) + '</div></div>' +
    group(null, card(
      '<div class="sw-row"><div><div class="sw-row-title">' + esc(t('Backup_FolderTitle.Text')) + '</div><div class="path">D:\\Sync\\Snapwell</div></div><div class="sw-row-ctl">' + btn(t('Backup_SyncFolderButton.Content')) + tog(true, t('Backup_SyncToggle.AutomationName')) + '</div></div>' +
      row('Backup_LastSyncTitle.Text', null, btn(t('Backup_SyncNowButton.Content')), { desc: t('Backup.SyncWithTimestamp', { timestamp: '2026/10/31 9:12', status: t('Backup.Sync.Pushed') }) }) +
      (demo.state === 'error' ? '<div class="sw-sub"><div class="infobar error">' + I('error') + '<div>' + esc(t('Backup.Sync.Failed', { message: t('Backup.SyncReason.MissingFolder') })) + '</div></div></div>' : ''))) +
    group('Backup_FileTitle.Text', card(
      row('Backup_ExportTitle.Text', 'Backup_ExportDescription.Text', btn(t('Backup_ExportButton.Content'))) +
      row('Backup_ImportTitle.Text', 'Backup_ImportDescription.Text', btn(t('Backup_ImportButton.Content'))))) +
    '<p class="sw-hint">' + esc(t('Backup_SaveHint.Text')) + '</p>';

  // ランチャーのプリセットの図形（20 × 12）。破線はサイズ維持の中央だけ
  const PRESET = {
    top: [0, 0, 1, .5], bottom: [0, .5, 1, 1], left: [0, 0, .5, 1], right: [.5, 0, 1, 1], tl: [0, 0, .5, .5], tr: [.5, 0, 1, .5], bl: [0, .5, .5, 1], br: [.5, .5, 1, 1],
    l3: [0, 0, 1 / 3, 1], r3: [2 / 3, 0, 1, 1], l23: [0, 0, 2 / 3, 1], r23: [1 / 3, 0, 1, 1], c3: [1 / 3, 0, 2 / 3, 1], center: [.2, .2, .8, .8], centerKeep: [.3, .25, .7, .75], max: [0, 0, 1, 1],
  };
  function picon(id) {
    const [a, b, c, d] = PRESET[id];
    const inner = id === 'centerKeep' ? '<rect class="d" x="' + (1 + a * 18) + '" y="' + (1 + b * 10) + '" width="' + (c - a) * 18 + '" height="' + (d - b) * 10 + '" rx="1"/>' : '<rect class="f" x="' + (1 + a * 18) + '" y="' + (1 + b * 10) + '" width="' + (c - a) * 18 + '" height="' + (d - b) * 10 + '" rx="1"/>';
    return '<svg class="picon" viewBox="0 0 20 12" aria-hidden="true"><rect class="o" x=".5" y=".5" width="19" height="11" rx="2"/>' + inner + '</svg>';
  }
  window.SW_PICON = picon;
  render.launcher = () => {
    const groups = [['Launcher.Group.Halves', ['top', 'bottom', 'left', 'right']], ['Launcher.Group.Quarters', ['tl', 'tr', 'bl', 'br']], ['Launcher.Group.Thirds', ['l3', 'r3']], ['Launcher.Group.TwoThirds', ['l23', 'r23']], ['Launcher.Group.CenterThird', ['c3']], ['Launcher.Group.Center', ['center', 'centerKeep']], ['Launcher.Group.Maximize', ['max']]];
    const on = new Set(['left', 'right', 'tl', 'l3', 'r23', 'c3', 'center', 'max']);
    return head('Launcher_Title.Text', 'Launcher_Lead.Text') +
      '<div class="lp-tools">' + btn(t('Launcher_SelectAll.Content')) + btn(t('Launcher_ClearAll.Content')) + btn(t('Launcher_Reset.Content')) + '<span class="count">' + esc(t('Launcher.Showing.Other', { count: 8, total: 16 })) + '</span></div>' +
      card('<div class="lp-groups">' + groups.map(([g, ids]) => '<div class="lp-group"><h4>' + esc(t(g)) + '</h4><div class="lp-opts">' + ids.map(id =>
        '<label class="check lp-opt"><input type="checkbox"' + (on.has(id) ? ' checked' : '') + '>' + picon(id) + '<span>' + esc(t('Launcher.Preset.' + id)) + '</span></label>').join('') + '</div></div>').join('') + '</div>') +
      group('Launcher_PreviewTitle.Text', '<div class="sw-card" style="padding:16px"><iframe title="launcher preview" src="launcher.html?embed=panel&v=' + SW.state.variant + '&lang=' + SW.state.lang + '&theme=' + (SW.state.theme === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : SW.state.theme) + '" style="width:100%;height:200px;border:0;display:block"></iframe></div>') ;
  };

  let cornerSel = 'Corner.SystemDefault', look = { preview: true, lines: true, trace: true };
  render.look = () => {
    const C = [['Corner.SystemDefault', 'Look_CornerDefaultDescription.Text', 8], ['Corner.Round', 'Look_CornerRoundDescription.Text', 8], ['Corner.RoundSmall', 'Look_CornerSmallDescription.Text', 4], ['Corner.DoNotRound', 'Look_CornerNoneDescription.Text', 0]];
    return head('Look_Title.Text', 'Look_Lead.Text') +
      group(null, card(row('Look_CornersTitle.Text', 'Look_CornersDescription.Text', combo(t(cornerSel))))) +
      group('Look_CornerExamplesTitle.Text', card('<div class="corner-cards">' + C.map(([k, d, r]) => '<button class="corner-card" data-corner="' + k + '" aria-pressed="' + (cornerSel === k) + '"><div class="shape" style="border-top-left-radius:' + r + 'px"></div><span class="lbl">' + esc(t(k)) + '</span><span class="d">' + esc(t(d)) + '</span></button>').join('') + '</div>')) +
      '<p class="sw-hint">' + esc(t('Look_CornerExamplesHint.Text')) + '</p>' +
      group(null, card(row('Look_ZonePreviewTitle.Text', 'Look_ZonePreviewDescription.Text', tog(look.preview).replace('<button', '<button data-look="preview"')))) +
      group('Look_OverlayTitle.Text', card(
        row('Look_ZoneLinesTitle.Text', 'Look_ZoneLinesDescription.Text', tog(look.lines).replace('<button', '<button data-look="lines"')) +
        row('Look_PredictionLineTitle.Text', 'Look_PredictionLineDescription.Text', tog(look.trace).replace('<button', '<button data-look="trace"')))) +
      group('Look_OverlayExampleTitle.Text', card('<div class="ov-example" id="ovExample" role="img" aria-label="' + esc(t('Look_OverlayExampleName.AutomationName')) + '"></div>')) +
      '<p class="sw-hint">' + esc(t('Look_OverlayExampleHint.Text')) + '</p>';
  };
  function drawOverlayExample() {
    const host = document.getElementById('ovExample'); if (!host) return;
    const w = host.clientWidth, h = host.clientHeight, zx = w / 2 + 3, zw = w / 2 - 9, zh = h / 2 - 9;
    let s = '<svg viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true">';
    if (look.preview) {
      s += '<rect class="ov-zone" x="' + zx + '" y="6" width="' + zw + '" height="' + zh + '" rx="8"/>';
      if (look.lines) s += '<rect class="ov-zone-line" x="' + (zx + .75) + '" y="6.75" width="' + (zw - 1.5) + '" height="' + (zh - 1.5) + '" rx="8"/>';
    }
    s += '<rect class="ov-win" x="' + (w * 0.18) + '" y="' + (h * 0.48) + '" width="180" height="104" rx="8"/><line x1="' + (w * 0.18) + '" y1="' + (h * 0.48 + 28) + '" x2="' + (w * 0.18 + 180) + '" y2="' + (h * 0.48 + 28) + '" stroke="var(--sw-line)"/>';
    if (look.preview && look.trace) {
      const x1 = w * 0.18 + 90, y1 = h * 0.48 + 52, x2 = zx + zw / 2, y2 = 6 + zh / 2;
      s += '<line class="trace" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"/><rect class="stop-mark" x="' + (x2 - 4) + '" y="' + (y2 - 4) + '" width="8" height="8" rx="2"/>';
    }
    if (!look.preview) s += '<text class="ov-off" x="16" y="28">' + esc(t('Look.Preview.Off')) + '</text>';
    host.innerHTML = s + '</svg>';
  }

  // ---------- ナビと描画 ----------
  const nav = document.getElementById('nav'), ind = document.getElementById('navInd');
  let indSpring = null;
  function renderNav() {
    nav.querySelectorAll('.sw-nav-item').forEach(e => e.remove());
    PAGES.forEach(([id, key]) => {
      const b = document.createElement('button');
      b.className = 'sw-nav-item'; b.dataset.page = id; b.innerHTML = I(id) + '<span>' + esc(t(key)) + '</span>';
      if (id === current) b.setAttribute('aria-current', 'page');
      b.addEventListener('click', () => { current = id; renderPage(); });
      nav.appendChild(b);
    });
  }
  function placeIndicator(animate) {
    const sel = nav.querySelector('[aria-current="page"]'); if (!sel) return;
    const y = sel.offsetTop + (sel.offsetHeight - ind.offsetHeight) / 2;
    if (!indSpring) indSpring = new SW.Spring('select', y, v => { ind.style.transform = 'translateY(' + v + 'px)'; });
    if (animate) indSpring.to(y); else indSpring.jump(y);
  }
  function renderPage() {
    nav.querySelectorAll('.sw-nav-item').forEach(b => b.toggleAttribute('aria-current', false));
    const sel = nav.querySelector('[data-page="' + current + '"]'); if (sel) sel.setAttribute('aria-current', 'page');
    placeIndicator(true);
    const content = document.getElementById('content');
    content.innerHTML = '<div class="sw-page">' + render[current]() + '</div>';
    content.scrollTop = 0;
    SW.hydrateToggles(content);
    wirePage(content);
    renderFooter();
  }
  function renderFooter() {
    const el = document.getElementById('footerStatus');
    if (demo.state === 'dirty') el.innerHTML = '<span class="dot"></span>' + esc(t('MainWindow.Status.Changed')) + ' · ' + esc(t('MainWindow.Status.SavingApplies'));
    else if (demo.state === 'error') el.textContent = t('MainWindow.Status.ReadOnly');
    else el.textContent = t('MainWindow.Status.SavingApplies');
  }
  function wirePage(content) {
    content.querySelectorAll('input.slider').forEach(s => {
      const sync = () => { const p = (s.value - s.min) / (s.max - s.min) * 100; s.style.setProperty('--p', p + '%'); const n = s.parentElement.querySelector('.numbox'); if (n) n.value = s.value; };
      s.addEventListener('input', sync); sync();
    });
    content.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => { c.parentElement.querySelectorAll('.chip').forEach(o => o.setAttribute('aria-pressed', 'false')); c.setAttribute('aria-pressed', 'true'); }));
    content.querySelectorAll('.feel-card').forEach(c => c.addEventListener('click', () => {
      feelSel = c.dataset.feel; content.querySelectorAll('.feel-card').forEach(o => o.setAttribute('aria-pressed', String(o === c)));
      if (trial) trial.o.preset = feelSel;
    }));
    content.querySelectorAll('.corner-card').forEach(c => c.addEventListener('click', () => { cornerSel = c.dataset.corner; renderPage(); }));
    content.querySelectorAll('.disclosure, .expander-head').forEach(d => d.addEventListener('click', () => {
      const open = d.getAttribute('aria-expanded') !== 'true'; d.setAttribute('aria-expanded', String(open));
      const body = d.classList.contains('expander-head') ? d.nextElementSibling : d.closest('.sw-row').nextElementSibling;
      if (d.classList.contains('expander-head') && body) body.hidden = !open;
      if (d.classList.contains('disclosure')) {
        if (open) { const kind = { 0: 'Drag', 1: 'Layout', 2: 'Bar', 3: 'Arrow' }[[...content.querySelectorAll('.disclosure')].indexOf(d)]; d.closest('.sw-row').insertAdjacentHTML('afterend', osDiagram(kind)); }
        else if (body && body.classList.contains('diagram')) body.remove();
      }
    }));
    content.addEventListener('sw-toggle', e => {
      const k = e.target.dataset.look; if (!k) return; look[k] = e.detail; drawOverlayExample();
    });
    const stage = content.querySelector('#trialStage');
    if (stage) {
      trial = new ThrowStage(stage, { preset: feelSel, title: t('Feel_TrialWindowLabel.Text') });
      content.querySelector('#trialThrow').addEventListener('click', () => trial.throwRandom());
      content.querySelectorAll('#trialMode button').forEach(b => b.addEventListener('click', () => {
        content.querySelectorAll('#trialMode button').forEach(o => o.setAttribute('aria-pressed', String(o === b))); trial.o.mode = b.dataset.mode;
      }));
    }
    drawOverlayExample();
  }

  // ---------- 初回セットアップ ----------
  let step = 0, plan = 0, welcome = null;
  const STEPS = ['Setup.Step.Welcome', 'Setup.Step.StandardFeatures', 'Setup.Step.Hotkeys', 'Setup.Step.Grid'];
  function renderSetup() {
    document.getElementById('steps').innerHTML = STEPS.map((k, i) => '<div class="step' + (i < step ? ' done' : i === step ? ' current' : '') + '"><span class="n">' + (i + 1) + '</span>' + esc(t(k)) + '</div>').join('');
    document.getElementById('setupCount').textContent = t('Setup.Count', { step: step + 1 });
    document.getElementById('setupBack').hidden = step === 0;
    document.getElementById('setupNext').textContent = step === 0 ? t('Setup.Welcome.Start') : step === 3 ? t('Setup.Done') : t('Setup.Next');
    const inner = document.getElementById('setupInner');
    let h = '';
    if (step === 0) {
      h = '<div class="throw-stage welcome-stage" id="welcomeStage"></div><div class="welcome-hint" id="welcomeHint"></div>' +
        '<h2 class="setup-h" style="margin-top:16px">' + esc(t('Setup.Welcome.Title')) + '</h2><p class="setup-lead">' + esc(t('Setup.Welcome.Body')) + '</p>' +
        card(row('Setup_UpdateTitle.Text', 'Setup_UpdateDescription.Text', tog(false)));
    } else if (step === 1) {
      h = '<h2 class="setup-h">' + esc(t('Setup.Standard.Title')) + '</h2><p class="setup-lead">' + esc(t('Setup.Standard.Lead')) + '</p>' +
        card('<table class="std-table"><tr><td>' + esc(t('Setup.Standard.Drag')) + '</td><td class="muted">' + esc(t('Setup.Standard.OnToOff')) + '</td></tr><tr><td>' + esc(t('Setup.Standard.Layouts')) + '</td><td class="muted">' + esc(t('Setup.Standard.OnToOff')) + '</td></tr><tr><td><span class="kbd">Win</span> ' + esc(t('Setup.Standard.ArrowsTemplate', { keys: '' }).trim()) + '</td><td class="muted">' + esc(t('Setup.Standard.Replace')) + '</td></tr></table>') +
        '<label class="consent check"><input type="checkbox" checked><span>' + esc(t('Setup.Standard.Consent')) + '</span></label><p class="sw-hint">' + esc(t('Setup.Standard.Hint')) + '</p>';
    } else if (step === 2) {
      h = '<h2 class="setup-h">' + esc(t('Setup.Hotkeys.Title')) + '</h2><p class="setup-lead">' + esc(t('Setup.Hotkeys.Lead')) + '</p>' +
        card(row(null, null, tag(t('Setup.Hotkeys.Available')), { title: t('Setup.Hotkeys.Launcher'), desc: '' }).replace('<div class="sw-row-ctl">', '<div class="sw-row-ctl">' + kbd('Ctrl+Alt+Space')) +
          row(null, null, tag(t('Setup.Hotkeys.Conflict'), 'neg'), { title: t('Setup.Hotkeys.Halves'), desc: '' }).replace('<div class="sw-row-ctl">', '<div class="sw-row-ctl">' + kbd('Ctrl+Alt') + '<span class="kbd-plus">' + esc(L('+ 矢印 / U I J K', '+ arrow keys / U I J K')) + '</span>')) +
        '<p class="sw-hint">' + esc(t('Setup.Hotkeys.Hint')) + '</p>';
    } else {
      const P = [[8, 8, 'Setup.Plan.8x8'], [12, 6, 'Setup.Plan.12x6'], [6, 4, 'Setup.Plan.6x4']];
      h = '<h2 class="setup-h">' + esc(t('Setup.Grid.Title')) + '</h2><p class="setup-lead">' + esc(t('Setup.Grid.Lead')) + '</p>' +
        '<div class="plan-cards">' + P.map(([c, r, d], i) => '<button class="plan-card" data-plan="' + i + '" aria-pressed="' + (plan === i) + '"><div class="mini" style="grid-template-columns:repeat(' + c + ',1fr)">' + '<i></i>'.repeat(c * r) + '</div><span class="nm">' + esc(t('Setup.Grid.PlanName', { columns: c, rows: r })) + '</span><span class="d">' + esc(t(d)) + '</span></button>').join('') + '</div>' +
        group(null, card(row('Setup.Grid.Gap', null, slider(8, 0, 40, 'px', t('Setup.Grid.GapName')))));
    }
    inner.innerHTML = h;
    SW.hydrateToggles(inner);
    inner.querySelectorAll('input.slider').forEach(s => { const p = (s.value - s.min) / (s.max - s.min) * 100; s.style.setProperty('--p', p + '%'); });
    inner.querySelectorAll('.plan-card').forEach(b => b.addEventListener('click', () => { plan = +b.dataset.plan; renderSetup(); }));
    if (step === 0) {
      const hint = document.getElementById('welcomeHint');
      const setHint = k => { hint.innerHTML = (k === 'held' ? '<svg width="24" height="8" aria-hidden="true"><line class="trace" x1="0" y1="4" x2="16" y2="4"/><rect class="stop-mark" x="16" y="0" width="8" height="8" rx="2"/></svg>' : '') + esc(t(k === 'held' ? 'Setup.Welcome.HintHeld' : k === 'again' ? 'Setup.Welcome.HintAgain' : 'Setup.Welcome.Hint')); };
      setHint('idle');
      welcome = new ThrowStage(document.getElementById('welcomeStage'), { preset: 'standard', title: 'Snapwell', cardW: 176, cardH: 112, onHint: k => setHint(k === 'landed' ? 'idle' : k) });
    }
  }
  document.getElementById('setupNext').addEventListener('click', () => { step = Math.min(3, step + 1); renderSetup(); });
  document.getElementById('setupBack').addEventListener('click', () => { step = Math.max(0, step - 1); renderSetup(); });

  // ---------- モックの状態 ----------
  [['demoState', 'state'], ['demoUpdate', 'update']].forEach(([id, key]) => {
    document.querySelectorAll('#' + id + ' button').forEach(b => b.addEventListener('click', () => {
      demo[key] = b.dataset.value; document.querySelectorAll('#' + id + ' button').forEach(o => o.setAttribute('aria-pressed', String(o === b)));
      if (key === 'update') current = 'general'; renderPage();
    }));
  });

  const p = new URLSearchParams(location.search).get('page'); if (p && render[p]) current = p;
  SW.onChange(() => { renderNav(); renderPage(); renderSetup(); requestAnimationFrame(() => placeIndicator(false)); });
  SW.apply();
})();
</script>
</body>
</html>
