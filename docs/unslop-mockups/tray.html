<!doctype html>
<html lang="ja" data-variant="tobe">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snapwell トレイの案</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="kit.css">
<style>
/* デスクトップの右下（実寸）。メニューは Win32 のレイヤードウィンドウで描く */
.desk { position: relative; width: 760px; height: 560px; border-radius: var(--sw-r-m); overflow: hidden; background-color: var(--sw-desktop);
  background-image: linear-gradient(var(--sw-desktop-line) 1px, transparent 1px), linear-gradient(90deg, var(--sw-desktop-line) 1px, transparent 1px); background-size: 24px 24px; }
.taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 48px; display: flex; align-items: center; justify-content: flex-end; gap: 4px; padding: 0 8px;
  background: color-mix(in srgb, var(--sw-surface) 88%, transparent); border-top: 1px solid var(--sw-line); }
.tray-btn { width: 32px; height: 40px; display: grid; place-items: center; border: 0; border-radius: var(--sw-r-s); background: transparent; }
.tray-btn:hover, .tray-btn[aria-expanded="true"] { background: var(--sw-raised); }
.clock { font-size: var(--sw-fs-caption); line-height: 16px; text-align: right; padding: 0 8px; color: var(--sw-text); }

.menu { position: absolute; right: 48px; bottom: 56px; width: var(--sw-tray-w); padding: var(--sw-tray-pad);
  background: var(--sw-surface); border: 1px solid var(--sw-line-strong); border-radius: var(--sw-r-m); box-shadow: var(--sw-shadow-flyout); transform-origin: bottom right; }
.m-head { height: var(--sw-tray-header-h); display: flex; align-items: center; gap: 12px; padding: 0 12px; }
.m-head .name { font-size: var(--sw-fs-body); }
.m-head .right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.m-meta { min-height: var(--sw-tray-meta-h); display: flex; align-items: center; gap: 8px; padding: 0 12px 8px 44px; margin-top: -8px; font-size: var(--sw-fs-caption); line-height: var(--sw-lh-caption); color: var(--sw-text-3); }
.m-meta.err { color: var(--sw-negative); align-items: flex-start; }
.m-meta.err .ico { margin-top: 0; }
.m-sep { height: 1px; background: var(--sw-line); margin: 4px 0; }
.m-item { width: 100%; height: var(--sw-tray-item-h); display: flex; align-items: center; gap: 12px; padding: 0 12px; border: 0; border-radius: var(--sw-r-s); background: transparent; color: var(--sw-text); text-align: left; font-size: var(--sw-fs-body); }
.m-item .ico { color: var(--sw-text-2); }
.m-item:hover, .m-item.kb { background: var(--sw-raised); }
.m-item.kb { outline: var(--sw-focus-w) solid var(--sw-accent); outline-offset: -2px; }
.m-item.update { color: var(--sw-text); }
.m-item.update .ico { color: var(--sw-accent); }
.m-item:disabled { color: var(--sw-text-3); }
/* 現状: 文字だけで 34 px 字下げ、見出しは太字、タグは色つきのカプセル */
:root[data-variant="asis"] .m-item .ico { visibility: hidden; width: 22px; }
:root[data-variant="asis"] .m-head .name { font-weight: 700; font-size: 13px; }
:root[data-variant="asis"] .m-meta { padding-left: 12px; margin-top: 0; font-size: 11.5px; }
:root[data-variant="asis"] .m-item { font-size: 13px; }
:root[data-variant="asis"] .menu { border-color: var(--sw-line); }

/* Windows が描く吹き出し（NIF_INFO）。見た目は変えられない */
.balloon { width: 364px; max-width: 100%; box-sizing: border-box; padding: 16px; border-radius: var(--sw-r-m); background: #2b2b2b; color: #fff; font-family: "Segoe UI", sans-serif; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
.balloon .app { display: flex; gap: 8px; align-items: center; font-size: 12px; color: #c8c8c8; margin-bottom: 12px; }
.balloon .tt { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.balloon .tx { font-size: 14px; color: #e6e6e6; }
.os-note { margin-top: 8px; font-size: var(--sw-fs-caption); color: var(--sw-text-3); }
.icon-states { display: flex; gap: 24px; flex-wrap: wrap; }
.icon-state { display: grid; justify-items: center; gap: 8px; font-size: var(--sw-fs-caption); color: var(--sw-text-2); }
.icon-state .big { width: 64px; height: 64px; display: grid; place-items: center; border-radius: var(--sw-r-m); background: var(--sw-surface); border: 1px solid var(--sw-line); }
</style>
</head>
<body>
<main class="doc-wrap">
  <h1 data-ja="トレイ" data-en="Tray">トレイ</h1>
  <p class="doc-lead" data-ja="通知領域のアイコンを押すと開くメニュー（幅 320 DIP）。ヘッダーのスイッチで実行と一時停止を切り替えます。メニューは開くとばね（m 1 · f 4.5 Hz · ζ 1.0）で 4 px 浮き上がります。" data-en="The menu opened from the notification area icon (320 DIP wide). The header switch toggles running and paused. The menu rises 4 px on a spring (m 1 · f 4.5 Hz · ζ 1.0) when it opens."></p>

  <div class="state-bar">
    <span data-ja="状態" data-en="State">状態</span>
    <div class="seg" id="st" role="group">
      <button data-value="active" aria-pressed="true" data-k="Tray.Status.Active"></button>
      <button data-value="paused" data-k="Tray.Status.Paused"></button>
      <button data-value="error" data-k="Tray.Status.Error"></button>
    </div>
    <span data-ja="更新" data-en="Update">更新</span>
    <div class="seg" id="up" role="group">
      <button data-value="0" aria-pressed="true" data-ja="なし" data-en="None">なし</button>
      <button data-value="1" data-ja="あり" data-en="Available">あり</button>
    </div>
    <span data-ja="キーボード" data-en="Keyboard">キーボード</span>
    <div class="seg" id="kb" role="group">
      <button data-value="0" aria-pressed="true" data-ja="マウス" data-en="Mouse">マウス</button>
      <button data-value="1" data-ja="矢印キーで選択中" data-en="Arrow-key selection">矢印キーで選択中</button>
    </div>
  </div>

  <div class="stage">
    <div class="desk" id="desk">
      <div class="menu" id="menu" role="menu"></div>
      <div class="taskbar">
        <button class="tray-btn" id="trayBtn" aria-expanded="true" aria-label="Snapwell"></button>
        <div class="clock num">10:24<br>2026/11/01</div>
      </div>
    </div>
  </div>

  <section class="doc-section">
    <h2 data-ja="通知領域のアイコン（16 DIP）" data-en="Notification area icon (16 DIP)">通知領域のアイコン</h2>
    <p data-ja="ロゴと同じ形。止まった四角だけが状態で変わります。一時停止は全体を 38% に、異常は四角の代わりに赤い印。" data-en="Same shape as the logo. Only the stopped square changes with state. Paused dims everything to 38%; error replaces the square with a red mark."></p>
    <div class="icon-states" id="iconStates"></div>
  </section>

  <section class="doc-section">
    <h2 data-ja="更新の吹き出し（Windows が描く）" data-en="Update balloon (drawn by Windows)">更新の吹き出し</h2>
    <p data-ja="Shell_NotifyIcon の NIF_INFO。見た目は Windows が決めるため、ここでは文言だけを決めます。トーストは使いません（AUMID の登録が要るため）。" data-en="Shell_NotifyIcon with NIF_INFO. Windows owns the look, so only the wording is ours. Toasts are not used (they need an AUMID)."></p>
    <div class="balloon" role="img"><div class="app" id="balloonApp"></div><div class="tt" data-k="Update.NotificationTitle"></div><div class="tx" id="balloonText"></div></div>
    <div class="os-note" data-ja="灰色の枠は Windows の描画の例。Snapwell のトークンは当てない" data-en="The grey frame is an example of Windows' own drawing. Snapwell tokens do not apply"></div>
  </section>
</main>
<script src="strings.js"></script>
<script src="kit.js"></script>
<script>
(function () {
  'use strict';
  const t = SW.t, I = SW.icon;
  SW.docBar('tray.html');
  const demo = { status: 'active', update: false, kb: false };
  let enabled = true, appear = null;

  // 16 px のトレイアイコン。状態は止まった四角だけで示す
  function trayIcon(kind, size) {
    const s = size || 16;
    const square = kind === 'error'
      ? '<circle cx="30" cy="14" r="9" fill="var(--sw-negative)"/><path d="M30 9 V15" stroke="var(--sw-surface)" stroke-width="3" stroke-linecap="round"/><circle cx="30" cy="19" r="1.7" fill="var(--sw-surface)"/>'
      : kind === 'paused' ? '<rect x="24.5" y="8.5" width="11" height="11" rx="2" fill="none" stroke="var(--sw-ink)" stroke-width="3"/>'
      : '<rect x="23" y="7" width="14" height="14" rx="3" fill="var(--sw-accent)"/>';
    const asisSquare = kind === 'active' ? '<rect x="23" y="7" width="14" height="14" rx="3" fill="var(--sw-accent)"/>' : square;
    return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 44 44" aria-hidden="true" style="opacity:' + (kind === 'paused' ? .38 : 1) + '">' +
      '<rect x="3" y="3" width="38" height="38" rx="9" fill="none" stroke="var(--sw-ink)" stroke-width="4"/>' +
      (kind !== 'error' ? '<path d="M10 34 L22 22" stroke="var(--sw-ink)" stroke-width="3" stroke-dasharray="3 4" fill="none"/>' : '') +
      (SW.state.variant === 'asis' ? asisSquare : square) + '</svg>';
  }

  function render() {
    const kind = demo.status;
    const statusLabel = t(kind === 'error' ? 'Tray.Status.Error' : kind === 'paused' ? 'Tray.Status.Paused' : 'Tray.Status.Active');
    const tagCls = kind === 'error' ? 'neg' : kind === 'paused' ? 'caution' : 'pos';
    const items = [];
    if (demo.update) items.push(['update', t('Tray.UpdateAvailable', { version: '1.0.4' }), 'update']);
    items.push(['arrange', t('Tray.Arrange')], ['launcher', t('Tray.Launcher')], 'sep', ['general', t('Tray.Settings')], ['exit', t('Tray.Exit')]);
    let n = 0;
    const html =
      '<div class="m-head">' + trayIcon(kind, 20) + '<span class="name">Snapwell</span><div class="right"><span class="tag ' + tagCls + '">' + statusLabel + '</span><button id="mToggle" data-toggle="' + (enabled ? 'on' : 'off') + '" aria-label="' + t('Status.Accessibility.ToggleOn') + '"></button></div></div>' +
      '<div class="m-meta">' + t('Tray.Monitors.Other', { count: 2 }) + '</div>' +
      (kind === 'error' ? '<div class="m-meta err">' + I('error') + '<span>' + t('Status.HookFailure') + '</span></div>' : '') +
      '<div class="m-sep"></div>' +
      items.map(it => {
        if (it === 'sep') return '<div class="m-sep"></div>';
        n++;
        return '<button class="m-item' + (it[2] ? ' ' + it[2] : '') + (demo.kb && n === 2 ? ' kb' : '') + '" role="menuitem">' + I(it[0]) + '<span>' + it[1] + '</span></button>';
      }).join('');
    const menu = document.getElementById('menu');
    menu.innerHTML = html;
    SW.hydrateToggles(menu);
    menu.querySelector('#mToggle').addEventListener('sw-toggle', e => {
      enabled = e.detail; demo.status = enabled ? (demo.status === 'error' ? 'error' : 'active') : (demo.status === 'error' ? 'error' : 'paused');
      syncSeg(); render();
    });
    document.getElementById('trayBtn').innerHTML = trayIcon(kind, 16);
    document.getElementById('iconStates').innerHTML = ['active', 'paused', 'error'].map(k =>
      '<div class="icon-state"><div class="big">' + trayIcon(k, 32) + '</div><span>' + t(k === 'error' ? 'Tray.Status.Error' : k === 'paused' ? 'Tray.Status.Paused' : 'Tray.Status.Active') + '</span></div>').join('');
    document.getElementById('balloonApp').innerHTML = trayIcon('active', 16) + '<span>Snapwell</span>';
    document.getElementById('balloonText').textContent = t('Tray.UpdateAvailable', { version: '1.0.4' });
  }
  function syncSeg() {
    document.querySelectorAll('#st button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.value === demo.status)));
  }

  // メニューの出現: 不透明度と 4 px の浮き上がりを同じばねで動かす
  function open(show) {
    const menu = document.getElementById('menu');
    if (!appear) appear = new SW.Spring('surface', 1, v => { menu.style.opacity = Math.max(0, Math.min(1, v)); menu.style.transform = 'translateY(' + (1 - v) * 4 + 'px)'; menu.style.visibility = v < 0.01 ? 'hidden' : 'visible'; });
    appear.to(show ? 1 : 0);
    document.getElementById('trayBtn').setAttribute('aria-expanded', String(show));
  }
  document.getElementById('trayBtn').addEventListener('click', () => open(document.getElementById('trayBtn').getAttribute('aria-expanded') !== 'true'));

  document.querySelectorAll('#st button').forEach(b => b.addEventListener('click', () => { demo.status = b.dataset.value; enabled = demo.status !== 'paused'; syncSeg(); render(); }));
  [['up', 'update'], ['kb', 'kb']].forEach(([id, key]) => document.querySelectorAll('#' + id + ' button').forEach(b => b.addEventListener('click', () => {
    demo[key] = b.dataset.value === '1'; document.querySelectorAll('#' + id + ' button').forEach(o => o.setAttribute('aria-pressed', String(o === b))); render();
  })));
  SW.onChange(render);
  SW.apply();
})();
</script>
</body>
</html>
