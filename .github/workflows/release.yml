name: Release

# v* のタグを push すると、NativeAOT の成果物 (x64・ARM64 のポータブル版 zip) を作り、下書きのリリースに添付する。
# 手で試すときは workflow_dispatch (version を入れる。リリースは作らず、成果物だけをアーティファクトに置く)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'バージョン (例: 0.1.0)'
        required: true

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Snapwell.sln

      # 本体と設定画面を同じフォルダに出す (本体が隣の Snapwell.Settings.exe を起動する)。
      # NativeAOT のリンクには Visual Studio の C++ ツール (x64・ARM64) が要る。ランナーのイメージに入っている
      - name: Publish App
        run: >
          dotnet publish src/Snapwell.App/Snapwell.App.csproj -c Release -r ${{ matrix.rid }}
          --no-restore -p:Version=${{ steps.ver.outputs.version }} -o out/${{ matrix.rid }}

      - name: Publish Settings
        run: >
          dotnet publish src/Snapwell.Settings/Snapwell.Settings.csproj -c Release -r ${{ matrix.rid }}
          --no-restore -p:Version=${{ steps.ver.outputs.version }} -o out/${{ matrix.rid }}

      - name: Package
        shell: pwsh
        run: |
          $name = "Snapwell-${{ steps.ver.outputs.version }}-${{ matrix.rid }}"
          Get-ChildItem out/${{ matrix.rid }} -Filter *.pdb | Remove-Item
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md out/${{ matrix.rid }} -ErrorAction SilentlyContinue
          Compress-Archive -Path out/${{ matrix.rid }}/* -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File "$name.zip.sha256" -Encoding ascii

      - uses: actions/upload-artifact@v7
        with:
          name: snapwell-${{ matrix.rid }}
          path: |
            Snapwell-*.zip
            Snapwell-*.zip.sha256
          if-no-files-found: error

  release:
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # 署名鍵は environment の secret に置く。承認者と対象のタグを environment 側で制限し、
    # 未承認のタグの実行に鍵を渡さない (docs/RELEASE.md)
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate update manifest
        shell: bash
        run: |
          dotnet run --project tools/ManifestTool -c Release -- generate \
            --version "${GITHUB_REF_NAME#v}" --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dist dist --summary release/summary.json --out dist/latest.json

      - name: Sign update manifest
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::UPDATE_SIGNING_KEY が未設定"
            exit 1
          fi
          # アプリに埋め込む公開鍵 (リポジトリの release/update-public-key.txt) と、秘密鍵から導いた公開鍵が
          # 一致しなければ失敗させる。別の有効な鍵への差し替えや誤設定を、配布の前に止める
          if [ ! -s release/update-public-key.txt ]; then
            echo "::error::release/update-public-key.txt が無い"
            exit 1
          fi
          public_key=$(dotnet run --project tools/ManifestTool -c Release --no-build --no-restore -- sign \
            --key-env UPDATE_SIGNING_KEY --in dist/latest.json --out dist/latest.json.sig)
          if [ "$public_key" != "$(tr -d '[:space:]' < release/update-public-key.txt)" ]; then
            echo "::error::UPDATE_SIGNING_KEY が release/update-public-key.txt の公開鍵と一致しない"
            rm -f dist/latest.json.sig
            exit 1
          fi

      - name: Verify update manifest
        shell: bash
        run: |
          dotnet run --project tools/ManifestTool -c Release --no-build --no-restore -- verify \
            --public release/update-public-key.txt --in dist/latest.json --sig dist/latest.json.sig

      # 下書きで作る。内容を確かめてから、手で公開する
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.zip.sha256 dist/latest.json dist/latest.json.sig
          --repo "$GITHUB_REPOSITORY"
          --draft --generate-notes --title "Snapwell $GITHUB_REF_NAME"
