name: Pages

# site/ を GitHub Pages に公開する。公開元は、リポジトリの Settings → Pages で「GitHub Actions」を選ぶ
# 公開は v1.0.0 のリリースと同じ日にそろえる (ダウンロードのボタンはそれまで 404)。それまでは手動で実行する。
# リリース後に自動にするなら、push の節 (branches: [main] と paths: ['site/**', '.github/workflows/pages.yml']) を足す
on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
