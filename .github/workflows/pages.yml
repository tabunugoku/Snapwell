name: Pages

# site/ を GitHub Pages に公開する。公開元は、リポジトリの Settings → Pages で「GitHub Actions」を選ぶ
# main の site/** の変更で自動に公開する (手動の実行もできる)。ダウンロードのボタンは v1.0.0 のリリースが公開されるまで 404 なので、
# この変更は v1.0.0 のリリースを公開する日にマージする
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
